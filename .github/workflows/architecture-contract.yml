name: Architecture contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  managed-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate managed Hermes upstream metadata and ownership
        run: python3 scripts/check_upstream_contract.py
